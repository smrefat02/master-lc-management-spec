openapi: 3.0.3
info:
  title: Sales Contract Management API
  description: REST API for managing sales contracts with auto-generated contract numbers
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8000/api
    description: Local development server
  - url: https://api.example.com
    description: Production server

tags:
  - name: Contracts
    description: Contract management operations
  - name: Buyers
    description: Buyer information operations

paths:
  /contracts:
    get:
      tags:
        - Contracts
      summary: List all contracts
      description: Retrieve all contracts with optional search/filter and summary statistics
      operationId: listContracts
      parameters:
        - name: search
          in: query
          description: Search by buyer name or contract number
          required: false
          schema:
            type: string
            example: "ABC Company"
        - name: status
          in: query
          description: Filter by contract status
          required: false
          schema:
            type: string
            enum: [Draft, Active, Pending, Completed, Cancelled]
            example: "Active"
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: per_page
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
      responses:
        "200":
          description: Successful response with contracts list and summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contract"
                  summary:
                    $ref: "#/components/schemas/ContractSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
              example:
                data:
                  - id: 1
                    buyer_id: 1
                    buyer_name: "ABC Company"
                    contract_no: "IIC/AKCL/CON/2025/01"
                    contract_date: "2025-01-15"
                    amendment_date: "2025-01-15"
                    total_orders: 5
                    order_quantity: 1000
                    value_usd: 50000.00
                    b2b_percent: 75.50
                    status: "Active"
                    remarks: "Initial contract"
                    created_at: "2025-01-15T10:30:00Z"
                    updated_at: "2025-01-15T10:30:00Z"
                summary:
                  total_contracts: 42
                  total_lc_value: 2150000.00
                  total_order_qty: 48500
                  avg_b2b: 72.35
                pagination:
                  current_page: 1
                  last_page: 5
                  per_page: 10
                  total: 42
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - Contracts
      summary: Create new contract
      description: Create a new sales contract with validation
      operationId: createContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
            example:
              buyer_id: 1
              contract_no: "IIC/AKCL/CON/2025/02"
              contract_date: "2025-02-01"
              amendment_date: "2025-02-01"
              total_orders: 3
              order_quantity: 500
              value_usd: 25000.00
              b2b_percent: 80.00
              status: "Draft"
              remarks: "New spring collection"
      responses:
        "201":
          description: Contract created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Contract created successfully"
                  data:
                    $ref: "#/components/schemas/Contract"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              example:
                message: "The given data was invalid."
                errors:
                  contract_no:
                    - "The contract number format is invalid. Must match: IIC/AKCL/CON/YYYY/NN"
                  b2b_percent:
                    - "The B2B percentage must be between 0 and 100."
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /contracts/{id}:
    get:
      tags:
        - Contracts
      summary: Get single contract
      description: Retrieve detailed information for a specific contract
      operationId: getContract
      parameters:
        - name: id
          in: path
          description: Contract ID
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Contract"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Contract not found"

    put:
      tags:
        - Contracts
      summary: Update contract
      description: Update an existing contract (for future edit functionality)
      operationId: updateContract
      parameters:
        - name: id
          in: path
          description: Contract ID
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "200":
          description: Contract updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Contract updated successfully"
                  data:
                    $ref: "#/components/schemas/Contract"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /contracts/next-number:
    get:
      tags:
        - Contracts
      summary: Get next available contract number
      description: Generate the next available contract number for a given year
      operationId: getNextContractNumber
      parameters:
        - name: year
          in: query
          description: Four-digit year for contract number
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2099
            example: 2025
      responses:
        "200":
          description: Next contract number generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_number:
                    type: string
                    pattern: '^IIC/AKCL/CON/\d{4}/\d{2}$'
                    example: "IIC/AKCL/CON/2025/03"
              example:
                contract_number: "IIC/AKCL/CON/2025/03"
        "400":
          description: Invalid year parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error (e.g., max contracts reached for year)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Maximum contracts (99) reached for year 2025"

  /buyers:
    get:
      tags:
        - Buyers
      summary: List all buyers
      description: Retrieve all buyers for dropdown population
      operationId: listBuyers
      responses:
        "200":
          description: Successful response with buyers list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: "ABC Company"
              example:
                data:
                  - id: 1
                    name: "ABC Company"
                  - id: 2
                    name: "XYZ Corporation"
                  - id: 3
                    name: "Global Traders Ltd"

components:
  schemas:
    Contract:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier
          example: 1
        buyer_id:
          type: integer
          description: Foreign key to buyer
          example: 1
        buyer_name:
          type: string
          description: Buyer name (joined from buyers table)
          example: "ABC Company"
        contract_no:
          type: string
          pattern: '^IIC/AKCL/CON/\d{4}/\d{2}$'
          description: Unique contract number in format IIC/AKCL/CON/YYYY/NN
          example: "IIC/AKCL/CON/2025/01"
        contract_date:
          type: string
          format: date
          description: Contract signing date
          example: "2025-01-15"
        amendment_date:
          type: string
          format: date
          description: Last amendment date (must be >= contract_date)
          example: "2025-01-15"
        total_orders:
          type: integer
          minimum: 0
          description: Total number of orders in contract
          example: 5
        order_quantity:
          type: integer
          minimum: 0
          description: Aggregate order quantity
          example: 1000
        value_usd:
          type: number
          format: decimal
          minimum: 0
          description: Total contract value in USD
          example: 50000.00
        b2b_percent:
          type: number
          format: decimal
          minimum: 0
          maximum: 100
          description: B2B percentage (0-100)
          example: 75.50
        status:
          type: string
          enum: [Draft, Active, Pending, Completed, Cancelled]
          description: Current contract status
          example: "Active"
        remarks:
          type: string
          nullable: true
          description: Additional notes/comments
          example: "Initial contract for spring collection"
        created_at:
          type: string
          format: date-time
          description: Record creation timestamp
          example: "2025-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: Last modification timestamp
          example: "2025-01-15T10:30:00Z"

    ContractInput:
      type: object
      required:
        - buyer_id
        - contract_no
        - contract_date
        - total_orders
        - order_quantity
        - value_usd
        - status
      properties:
        buyer_id:
          type: integer
          description: Foreign key to buyer
          example: 1
        contract_no:
          type: string
          pattern: '^IIC/AKCL/CON/\d{4}/\d{2}$'
          description: Unique contract number (auto-generated but user-editable)
          example: "IIC/AKCL/CON/2025/02"
        contract_date:
          type: string
          format: date
          description: Contract signing date
          example: "2025-02-01"
        amendment_date:
          type: string
          format: date
          description: Amendment date (optional, defaults to contract_date if not provided)
          example: "2025-02-01"
        total_orders:
          type: integer
          minimum: 0
          description: Total number of orders
          example: 3
        order_quantity:
          type: integer
          minimum: 0
          description: Aggregate order quantity
          example: 500
        value_usd:
          type: number
          format: decimal
          minimum: 0
          description: Total contract value in USD
          example: 25000.00
        b2b_percent:
          type: number
          format: decimal
          minimum: 0
          maximum: 100
          description: B2B percentage (0-100)
          example: 80.00
        status:
          type: string
          enum: [Draft, Active, Pending, Completed, Cancelled]
          description: Contract status
          example: "Draft"
        remarks:
          type: string
          nullable: true
          description: Additional notes
          example: "New spring collection"

    ContractSummary:
      type: object
      properties:
        total_contracts:
          type: integer
          description: Total number of contracts
          example: 42
        total_lc_value:
          type: number
          format: decimal
          description: Sum of all contract values in USD
          example: 2150000.00
        total_order_qty:
          type: integer
          description: Sum of all order quantities
          example: 48500
        avg_b2b:
          type: number
          format: decimal
          description: Average B2B percentage across all contracts
          example: 72.35

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
          description: Current page number
          example: 1
        last_page:
          type: integer
          description: Total number of pages
          example: 5
        per_page:
          type: integer
          description: Items per page
          example: 10
        total:
          type: integer
          description: Total number of items
          example: 42

    ValidationError:
      type: object
      properties:
        message:
          type: string
          description: General error message
          example: "The given data was invalid."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field-specific error messages
          example:
            contract_no:
              - "The contract number format is invalid."
            b2b_percent:
              - "The B2B percentage must be between 0 and 100."

    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
          example: "An error occurred"
